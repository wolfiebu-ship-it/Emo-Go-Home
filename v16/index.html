<!doctype html>
<html lang="de">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>EMO Go Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed black robot screen. No controls, no panels: you only talk to EMO. */
:root {
  --screen: #020709;
  --eye: #3fe6ff;
  --ink: #d8f8ff;
  --muted: #6d97a3;
  --panel: #08161b;
  --line: #17323c;
  --warn: #ffb35c;
  --font-ui: 'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #000; color: var(--ink); font-family: var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#face { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#subtitle { position: fixed; left: 16px; right: 16px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 500 clamp(18px, 3vw, 26px)/1.3 var(--font-ui); color: var(--eye); text-shadow: 0 0 12px rgba(63,230,255,.5); pointer-events: none; text-wrap: balance; }
#heard { position: fixed; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); text-align: center; font: 400 15px var(--font-ui); color: var(--muted); pointer-events: none; }
#ear { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: 10px; height: 10px; border-radius: 50%; background: var(--line); pointer-events: none; transition: background .2s, box-shadow .2s; }
#ear.on { background: var(--eye); box-shadow: 0 0 10px var(--eye); }
#ear.hot { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
#hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(460px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--warn); color: var(--ink); border-radius: 16px; padding: 14px 18px; font: 400 16px/1.45 var(--font-ui); text-align: center; pointer-events: none; }
#video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

</style>
</head>
<body>
<canvas id="face" aria-label="EMOs Gesicht"></canvas>
<div id="heard"></div>
<div id="subtitle" aria-live="polite"></div>
<div id="ear" title="EMO hört zu"></div>
<div id="hint" role="status" hidden></div>
<video id="video" playsinline muted></video>


<script src="brain/wissen.js"></script>
<script>
'use strict';
/* ================= Setup ================= */
const $ = s => document.querySelector(s);
const EYE = '#3fe6ff', HEART = '#ff4f8b';
let sick = 0; // 0 = normal cyan, 1 = queasy green
function eyeCol() {
  if (sick < .02) return EYE;
  const a = [0x3f, 0xe6, 0xff], b = [0x9c, 0xe8, 0x5a];
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * sick)).join(',') + ')';
}
const UA = navigator.userAgent;
const IS_SAFARI = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(UA);
const cvs = $('#face'), ctx = cvs.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1;
const FACE_Y = .4; // eye height on the screen (0 = top, .5 = middle)
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const c of [cvs, off]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  glow.width = Math.max(1, Math.round(W / 4)); glow.height = Math.max(1, Math.round(H / 4));
  S = Math.min(W / 1.75, H * 0.9);
}
addEventListener('resize', resize); resize();

const now = () => performance.now();
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = (k, dt) => 1 - Math.exp(-k * dt);
const lerp = (a, b, t) => a + (b - a) * t;

/* ================= Settings ================= */
const settings = { voiceMode: 'child', voiceName: '', pitch: 72, rate: 1.12, dodge: 45, cam: false, subs: false, volume: 1, apiKey: '', place: '' };
try {
  const old = JSON.parse(localStorage.getItem('emo-settings2') || '{}');
  if (old.apiKey) settings.apiKey = old.apiKey;
  if (old.place) settings.place = old.place;
  Object.assign(settings, JSON.parse(localStorage.getItem('emo-settings3') || '{}'));
} catch (e) {}
function saveSettings() { try { localStorage.setItem('emo-settings3', JSON.stringify(settings)); } catch (e) {} }

/* ================= Face state ================= */
const POSE_KEYS = ['w', 'h', 'r', 'tIn', 'tOut', 'bot', 'happy', 'dy'];
const basePose = () => ({ w: 1, h: 1, r: 1, tIn: 0, tOut: 0, bot: 0, happy: 0, dy: 0 });
const EXPR = {
  neutral: {},
  happy: { happy: .7, w: 1.06, h: .95 },
  laugh: { happy: .85, w: 1.12, h: .85 },
  sad: { tOut: .45, tIn: .05, h: .85, dy: .07 },
  angry: { tIn: .52, tOut: .06, h: .9 },
  surprised: { h: 1.18, w: .98, r: 1.5 },
  scared: { w: .74, h: .82, r: 1.6 },
  sleepy: { tIn: .56, tOut: .6, bot: .1 },
  asleep: { tIn: .94, tOut: .94, dy: .05 },
  squint: { tIn: .32, tOut: .32, bot: .3, w: 1.15 },
  smug: [{ tIn: .4, tOut: .3, happy: .35 }, { tIn: .2, tOut: .1, happy: .55 }],
  curious: [{ h: 1.12, w: 1.04 }, { tIn: .25, tOut: .38, h: .9 }],
  thinking: [{ tIn: .32, tOut: .12, h: .95 }, { h: 1.06 }],
  pain: { tIn: .45, tOut: .18, bot: .35 },
  wink: [{ happy: .6 }, { tIn: .94, tOut: .94 }],
  love: { special: 'heart' },
  dead: { special: 'x' },
  dizzy: { special: 'spiral' },
};
const eyes = [0, 1].map(() => ({ cur: basePose(), tgt: basePose(), special: null, crack: null }));
const gaze = { x: 0, y: 0, tx: 0, ty: 0 };
const face = { x: 0, y: 0, rot: 0, sc: 1, tx: 0, ty: 0, trot: 0, tsc: 1, k: 7 };
const hands = { t: 0, v: 0, target: 0, wave: 0, tremble: 0, since: 0 };
let blinkPhase = -1, nextBlink = now() + 2500;
let nextSaccade = now() + 1500;
let exprName = 'neutral', exprUntil = Infinity;
let shake = 0, flash = 0;
// slow motion, glitch and after-images for the "Peng" scenes
let shakeEnergy = 0, shakeTime = 0, calmTime = 0, lastAcc = null, dizzy = false, tongue = 0, motionOn = false;
let shards = [], tears = [], crying = 0, nextTear = 0;
let timeScale = 1, timeTarget = 1, glitch = 0, trail = [], lastTrail = 0, sweat = null;
let bullets = [], screenCracks = [], sparks = [];
let thinking = false, speaking = false, talkLevel = 0;
let actionLock = false;
let asleep = true, lastActive = now();
let bootT = 0, started = false;

function applyExpr(name) {
  const def = EXPR[name] || EXPR.neutral;
  const pair = Array.isArray(def) ? def : [def, def];
  exprName = name;
  eyes.forEach((e, i) => {
    const p = Object.assign(basePose(), pair[i]);
    POSE_KEYS.forEach(k => e.tgt[k] = p[k]);
    e.special = pair[i].special || null;
  });
}
function setExpr(name, ms = 2600) { applyExpr(name); exprUntil = ms ? now() + ms : Infinity; }
function restingExpr() {
  if (started && !greeted) return 'sleepy';
  if (asleep) return 'asleep';
  if (thinking) return 'thinking';
  if (hands.target > .5) return 'scared';
  if (now() - lastActive > 90000) return 'sleepy';
  return 'neutral';
}
function lookAt(x, y, ms = 0) { gaze.tx = x; gaze.ty = y; if (ms) nextSaccade = now() + ms; }

/* ================= Drawing ================= */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function heartPath(g, s) {
  g.beginPath(); g.moveTo(0, s * .35);
  g.bezierCurveTo(-s * 1.1, -s * .35, -s * .55, -s * 1.05, 0, -s * .45);
  g.bezierCurveTo(s * .55, -s * 1.05, s * 1.1, -s * .35, 0, s * .35); g.closePath();
}
function makeCrackLines(radius, n) {
  const lines = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-.3, .3); let x = 0, y = 0; const pts = [[0, 0]];
    const segs = 3 + Math.floor(Math.random() * 3);
    for (let s = 0; s < segs; s++) { const d = radius * rand(.18, .38); const aa = a + rand(-.5, .5); x += Math.cos(aa) * d; y += Math.sin(aa) * d; pts.push([x, y]); }
    lines.push(pts);
  }
  return lines;
}
function strokeLines(g, lines) { for (const l of lines) { g.beginPath(); l.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); } }

function drawEye(g, cx, cy, side, e, t) {
  if (e.flicker > .05 && Math.random() < e.flicker * .55) return;
  if (e.broken) { drawBrokenScreen(g, cx, cy, e.broken, t); return; }
  const p = e.cur;
  const blink = blinkPhase >= 0 ? Math.sin(blinkPhase * Math.PI) : 0;
  const talk = 1 + talkLevel * .16;
  const persp = 1 + gaze.x * side * .1;
  const w = .3 * S * p.w * persp;
  const h = .37 * S * p.h * talk * persp * (1 - blink * .9) * (0.08 + .92 * bootT);
  const r = Math.min(w, h) * .24 * p.r;
  g.save(); g.translate(cx, cy + p.dy * S);
  if (e.special === 'heart') {
    const beat = 1 + Math.sin(t / 140) * .07;
    g.scale(beat, beat); g.fillStyle = HEART; heartPath(g, w * .62); g.fill(); g.restore(); return;
  }
  if (e.special === 'x') {
    g.strokeStyle = eyeCol(); g.lineWidth = S * .055; g.lineCap = 'round'; const a = w * .34;
    g.beginPath(); g.moveTo(-a, -a); g.lineTo(a, a); g.moveTo(a, -a); g.lineTo(-a, a); g.stroke(); g.restore(); return;
  }
  if (e.special === 'spiral') {
    g.rotate(t / (dizzy ? 90 : 160) * side); g.scale(1 + .12 * Math.sin(t / 120), 1 + .12 * Math.sin(t / 120)); g.strokeStyle = eyeCol(); g.lineWidth = S * .034; g.lineCap = 'round'; g.beginPath();
    for (let a = 0; a < Math.PI * 6; a += .15) { const rr2 = a / (Math.PI * 6) * w * .45; const px = Math.cos(a) * rr2, py = Math.sin(a) * rr2; a ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke(); g.restore(); return;
  }
  rr(g, -w / 2, -h / 2, w, h, r); g.save(); g.clip();
  g.fillStyle = eyeCol(); g.fillRect(-w, -h, w * 2, h * 2);
  g.fillStyle = '#000';
  const inX = -side * w / 2 * 1.02, outX = side * w / 2 * 1.02;
  if (p.tIn > .001 || p.tOut > .001) {
    g.beginPath(); g.moveTo(inX, -h); g.lineTo(outX, -h); g.lineTo(outX, -h / 2 + p.tOut * h); g.lineTo(inX, -h / 2 + p.tIn * h); g.closePath(); g.fill();
  }
  if (p.bot > .001) g.fillRect(-w, h / 2 - p.bot * h, w * 2, h);
  if (p.happy > .001) { g.beginPath(); g.ellipse(0, h / 2 + h * .56 - p.happy * h * .64, w * .8, h * .56, 0, 0, Math.PI * 2); g.fill(); }
  if (e.crack) {
    g.globalAlpha = Math.max(0, e.crack.alpha); g.translate(e.crack.x * w, e.crack.y * h);
    g.strokeStyle = '#000'; g.lineWidth = Math.max(2, S * .008); g.lineJoin = 'round'; strokeLines(g, e.crack.lines);
    g.beginPath(); const hr = S * .045;
    for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2; const rad = hr * (i % 2 ? .7 : 1.1); i ? g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    g.fill(); g.globalAlpha = 1;
  }
  g.restore(); g.restore();
}

// A hit eye looks like a TV screen that got smacked: coloured stripes, a black ink blot, static and flicker.
function makeBrokenScreen() {
  const cols = ['#39ff6a', '#39ff6a', '#39ff6a', '#2bd15a', '#ff3df0', '#ffffff', '#3fe6ff', '#fff15a'];
  const lines = []; const n = 14 + Math.floor(Math.random() * 8);
  for (let k = 0; k < n; k++) lines.push({ x: rand(-.5, .5), w: rand(.008, .035), c: pick(cols), y0: rand(-.5, -.1), y1: rand(.1, .5), on: Math.random() < .85 });
  return { lines, blot: { x: rand(-.15, .15), y: rand(-.15, .1), r: rand(.18, .26) }, keep: rand(.25, .45), repair: 0 };
}
function drawBrokenScreen(g, cx, cy, b, t) {
  const w = .3 * S, h = .37 * S, r = Math.min(w, h) * .24, fade = 1 - b.repair;
  g.save(); g.translate(cx, cy);
  rr(g, -w / 2, -h / 2, w, h, r); g.save(); g.clip();
  // what is left of the normal picture, then the dead, dark part of the screen
  g.fillStyle = eyeCol(); g.fillRect(-w, -h, w * 2, h * 2);
  g.globalAlpha = fade; g.fillStyle = '#06120f'; g.fillRect(-w / 2 + b.keep * w * b.repair, -h, w * 2, h * 2);
  if (Math.random() < .5 * fade) { g.fillStyle = eyeCol(); g.globalAlpha = .55 * fade; g.fillRect(-w / 2, -h / 2, w * b.keep, h); }
  // coloured stripes, flickering
  for (const L of b.lines) {
    if (!L.on && Math.random() < .7) continue;
    g.globalAlpha = fade * (Math.random() < .12 ? .25 : .95);
    g.fillStyle = L.c; g.fillRect(L.x * w, L.y0 * h, Math.max(1.5, L.w * w), (L.y1 - L.y0) * h + h);
  }
  // static noise rows
  g.globalAlpha = fade * .8;
  for (let k = 0; k < 4; k++) {
    const y = rand(-.5, .5) * h, hh = rand(.01, .04) * h;
    for (let x = -w / 2; x < w / 2; x += 4) { const v = Math.floor(rand(60, 255)); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 4, hh); }
  }
  // black ink blot where the bullet hit, with dark streaks running out of it
  g.globalAlpha = fade; g.fillStyle = '#000';
  g.beginPath(); for (let k = 0; k <= 14; k++) { const a = k / 14 * Math.PI * 2, rad = b.blot.r * w * (k % 2 ? .65 : 1); const px = b.blot.x * w + Math.cos(a) * rad, py = b.blot.y * h + Math.sin(a) * rad; k ? g.lineTo(px, py) : g.moveTo(px, py); } g.fill();
  g.fillRect(b.blot.x * w - w * .02, b.blot.y * h, w * .04, h);
  g.restore();
  // the whole screen jumps a little now and then
  if (Math.random() < .08 * fade) { g.globalAlpha = .35; g.fillStyle = '#39ff6a'; g.fillRect(-w / 2, rand(-.5, .5) * h, w, 2); }
  g.restore(); g.globalAlpha = 1;
}
function drawHand(g, x, y, side, rot, t) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const u = S * .0078; g.scale(u, u);
  g.fillStyle = eyeCol();
  rr(g, -11, -6, 22, 20, 7); g.fill();
  const lens = [10.5, 13, 12.5, 10];
  for (let i = 0; i < 4; i++) {
    const fx = side > 0 ? -8.25 + i * 5.5 : 8.25 - i * 5.5;
    const wig = Math.sin(t / 110 + i * 1.3) * 1.4 * hands.wave;
    rr(g, fx - 2.5, -6 - lens[i] + wig, 5, lens[i] + 5, 2.5); g.fill();
  }
  g.save(); g.translate(-side * 10.5, 5); g.rotate(-side * .95); rr(g, -2.7, -12.5, 5.4, 14, 2.7); g.fill(); g.restore();
  g.restore();
}

function render(t) {
  const g = octx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, off.width, off.height);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (Math.random() - .5) * shake * 18, sy = (Math.random() - .5) * shake * 18;
  g.save();
  g.translate(W / 2 + face.x * S + sx, H * FACE_Y + face.y * S + sy); g.rotate(face.rot); g.scale(face.sc, face.sc);
  const gx = gaze.x * .085 * S, gy = gaze.y * .075 * S;
  // slow-motion after-images
  if (trail.length) {
    g.save(); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    trail.forEach((tr, k) => {
      g.save(); g.globalAlpha = .08 + .22 * (k / trail.length);
      g.translate(W / 2 + tr.x * S, H * FACE_Y + tr.y * S); g.rotate(tr.rot); g.scale(tr.sc, tr.sc);
      for (let i = 0; i < 2; i++) { const side = i ? 1 : -1; drawEye(g, side * .27 * S + gx, gy - .02 * S, side, eyes[i], t); }
      g.restore();
    });
    g.restore(); g.globalAlpha = 1;
  }
  for (let i = 0; i < 2; i++) { const side = i ? 1 : -1; drawEye(g, side * .27 * S + gx, gy - .02 * S, side, eyes[i], t); }
  if (sweat) {
    const k = (now() - sweat.t0) / 1400;
    if (k > 1) sweat = null;
    else {
      g.save(); g.globalAlpha = 1 - k * k; g.fillStyle = '#bff6ff';
      g.translate(sweat.side * .27 * S + sweat.side * .16 * S + gx, -.2 * S + k * .22 * S);
      g.beginPath(); g.moveTo(0, -S * .03); g.quadraticCurveTo(S * .022, 0, 0, S * .018); g.quadraticCurveTo(-S * .022, 0, 0, -S * .03); g.fill(); g.restore();
    }
  }
  if (hands.t > .01) {
    const downY = H * (1 - FACE_Y) / face.sc + .3 * S, upY = .17 * S;
    const y = lerp(downY, upY, hands.t);
    for (const side of [-1, 1]) {
      const trem = Math.sin(t / 22 + side) * hands.tremble * S * .006;
      drawHand(g, side * .76 * S + trem, y + Math.sin(t / 180 + side) * S * .01, side, side * (.12 + Math.sin(t / 160) * .14 * hands.wave), t);
    }
  }
  drawTongue(g, t);
  if (thinking) {
    for (let i = 0; i < 3; i++) { const a = (Math.sin(t / 200 - i * .9) + 1) / 2; g.globalAlpha = .3 + a * .7; g.fillStyle = EYE; g.beginPath(); g.arc((i - 1) * .07 * S, .3 * S, .018 * S, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha = 1;
  }
  if (asleep) {
    g.fillStyle = EYE; g.textAlign = 'center';
    for (let i = 0; i < 3; i++) { const ph = ((t / 1400) + i / 3) % 1; g.globalAlpha = Math.sin(ph * Math.PI); g.font = `600 ${Math.round(S * (.06 + i * .02))}px Fredoka, sans-serif`; g.fillText('Z', .5 * S + ph * .2 * S, -.25 * S - ph * .35 * S); }
    g.globalAlpha = 1;
  }
  g.restore();

  for (const c of screenCracks) {
    g.save(); g.translate(c.x, c.y); g.globalAlpha = Math.max(0, c.alpha) * .85; g.strokeStyle = '#e9fbff'; g.lineWidth = 1.6; g.lineJoin = 'round'; strokeLines(g, c.lines);
    g.beginPath(); g.arc(0, 0, S * .012, 0, Math.PI * 2); g.fillStyle = '#e9fbff'; g.fill(); g.restore();
  }
  for (const b of bullets) {
    const k = Math.min(1, b.p), x = lerp(b.x0, b.x1, k), y = lerp(b.y0, b.y1, k), r = lerp(b.r0, b.r1, k);
    const tx = lerp(b.x0, b.x1, Math.max(0, k - .2)), ty = lerp(b.y0, b.y1, Math.max(0, k - .2));
    const grad = g.createLinearGradient(tx, ty, x, y); grad.addColorStop(0, 'rgba(255,220,140,0)'); grad.addColorStop(1, 'rgba(255,230,170,.9)');
    g.strokeStyle = grad; g.lineWidth = r * 1.2; g.lineCap = 'round'; g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y); g.stroke();
    g.fillStyle = '#fff3d6'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    if (timeScale < .7) {
      // shock-wave rings around the bullet in slow motion
      for (let q = 0; q < 3; q++) { const ph = ((t / 380) + q / 3) % 1; g.globalAlpha = (1 - ph) * .45 * (1 - timeScale); g.strokeStyle = '#ffffff'; g.lineWidth = 1.5; g.beginPath(); g.arc(tx, ty, r * (1.5 + ph * 5), 0, Math.PI * 2); g.stroke(); }
      g.globalAlpha = 1;
    }
  }
  for (const s of sparks) { g.globalAlpha = Math.max(0, s.life); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill(); }
  for (const sh of shards) {
    g.save(); g.translate(sh.x, sh.y); g.rotate(sh.rot); g.globalAlpha = sh.alpha;
    g.beginPath(); sh.pts.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    g.fillStyle = eyeCol(); g.fill(); g.strokeStyle = 'rgba(220,250,255,.85)'; g.lineWidth = 1.2; g.stroke();
    g.restore();

/* ================= Rechnen: "zwei plus zwei", "10 mal 5", "dreiundzwanzig minus sieben" ================= */
const NUMW = { null: 0, eins: 1, ein: 1, eine: 1, einen: 1, zwei: 2, zwo: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, zwölf: 12, dreizehn: 13, vierzehn: 14, fünfzehn: 15, sechzehn: 16, siebzehn: 17, achtzehn: 18, neunzehn: 19, zwanzig: 20, dreißig: 30, dreissig: 30, vierzig: 40, fünfzig: 50, sechzig: 60, siebzig: 70, achtzig: 80, neunzig: 90 };
function wordNum(w) {
  if (w === '') return 0;
  if (/^\d+(,\d+)?$/.test(w)) return parseFloat(w.replace(',', '.'));
  if (w in NUMW) return NUMW[w];
  for (const [word, val] of [['million', 1e6], ['tausend', 1000], ['hundert', 100]]) {
    const i = w.indexOf(word);
    if (i >= 0) {
      const a = w.slice(0, i), b = w.slice(i + word.length).replace(/^en\b|^en/, '');
      const A = a ? wordNum(a) : 1, B = wordNum(b);
      return A == null || B == null ? null : A * val + B;
    }
  }
  const u = w.indexOf('und');
  if (u > 0) { const one = wordNum(w.slice(0, u)), ten = wordNum(w.slice(u + 3)); if (one != null && ten != null && one < 10 && ten >= 20 && ten % 10 === 0) return ten + one; }
  return null;
}
function mathAnswer(raw) {
  const text = ' ' + raw.toLowerCase()
    .replace(/(\d)\s*[x×*]\s*(\d)/g, '$1 mal $2').replace(/[×*]/g, ' mal ').replace(/[÷/:]/g, ' durch ').replace(/\+/g, ' plus ').replace(/(\d)\s*[-−]\s*(\d)/g, '$1 minus $2')
    .replace(/(\d)\.(\d{3})/g, '$1$2').replace(/(\d)\.(\d)/g, '$1,$2')
    .replace(/geteilt durch|dividiert durch|geteilt/g, ' durch ').replace(/multipliziert mit/g, ' mal ').replace(/\bmalnehmen\b/g, ' mal ').replace(/\b(\w+)mal\b/g, '$1 mal')
    .replace(/[^a-zäöüß0-9, ]/g, ' ') + ' ';
  const OPS = { plus: '+', und: null, minus: '-', weniger: '-', mal: '*', durch: '/' };
  const words = text.split(/\s+/).filter(Boolean);
  // group number words into numbers ("zwei hundert drei" -> 203)
  const toks = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (OPS[w]) { toks.push({ op: OPS[w], word: w }); continue; }
    let j = i, best = null, bestJ = i - 1;
    for (let k = i; k < Math.min(words.length, i + 4); k++) { const n = wordNum(words.slice(i, k + 1).join('').replace(/,$/, '')); if (n == null) break; best = n; bestJ = k; }
    if (best != null) { toks.push({ num: best, word: words.slice(i, bestJ + 1).join(' ') }); i = bestJ; }
    else toks.push({ other: w });
  }
  // find the first "number op number (op number)*" run
  for (let i = 0; i < toks.length; i++) {
    if (toks[i].num == null) continue;
    const run = [toks[i]]; let j = i + 1;
    while (j + 1 < toks.length && toks[j].op && toks[j + 1].num != null) { run.push(toks[j], toks[j + 1]); j += 2; }
    if (run.length < 3) continue;
    // multiplication and division first, then plus and minus
    const vals = [run[0].num], ops = [];
    for (let k = 1; k < run.length; k += 2) {
      const op = run[k].op, n = run[k + 1].num;
      if (op === '*') vals.push(vals.pop() * n);
      else if (op === '/') { if (n === 0) return { text: 'Durch null teilen? Da raucht mein Kopf! Das geht nicht.', mood: 'dizzy' }; vals.push(vals.pop() / n); }
      else { ops.push(op); vals.push(n); }
    }
    let res = vals[0]; ops.forEach((op, k) => { res = op === '+' ? res + vals[k + 1] : res - vals[k + 1]; });
    const fmt = n => (Math.round(n * 1000) / 1000).toLocaleString('de-DE', { maximumFractionDigits: 3 });
    const said = run.map(t => t.num != null ? fmt(t.num) : t.word === 'weniger' ? 'minus' : t.word).join(' ');
    const tail = pick(['', ' Bin ich schlau?', ' Hihi, easy!', ' Das war leicht!']);
    return { text: `${said} ist ${fmt(res)}!${tail}`, mood: pick(['smug', 'happy']) };
  }
  return null;
}

    : `${day === 1 ? 'Morgen' : 'Übermorgen'} in ${w.ort}: ${d.wetter}, ${d.min_grad} bis ${d.max_grad} Grad.`;

    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (e) {
    voskLoading = false;
    hint('EMO kann dich nicht hören. Lade die Seite neu und tippe bei der Mikrofon-Frage auf „Erlauben“.', 12000);
    return false;
  }
  micOn = true; listenMode = 'vosk'; earState();
  tryAudio();
  try {
    await loadScript('listen/vosk.js');
    const modelBytes = await fetchBytes('listen/vosk-model-small-de.tar.gz', 'ears');
    voskModel = await Vosk.createModel(URL.createObjectURL(new Blob([modelBytes])));
    const a = ac();
    voskRec = new voskModel.KaldiRecognizer(a.sampleRate);
    voskRec.setWords(true);
    voskRec.on('partialresult', m => { if (m.result.partial && voskBuf) clearTimeout(voskTimer); heardPartial(m.result.partial); });
    voskRec.on('result', m => {
      const r = m.result || {}, text = (r.text || '').replace(/\[unk\]/g, '').trim(), words = r.result || [];
      if (!text) { if (!voskBuf) { utterQuick = false; utterStart = 0; } return; }
      const conf = words.length ? words.reduce((a, w) => a + (w.conf || 0), 0) / words.length : 1;
      if (conf < .6 && !QUICK(norm(text))) { if (!voskBuf) { utterQuick = false; utterStart = 0; } return; }
      voskBuf = (voskBuf + ' ' + text).trim(); clearTimeout(voskTimer);
      voskTimer = setTimeout(() => { const all = voskBuf; voskBuf = ''; heardFinal(all); }, 700);
    });
    const srcNode = a.createMediaStreamSource(micStream);
    micProc = a.createScriptProcessor(4096, 1, 1);
    const sink = a.createGain(); sink.gain.value = 0;
    micProc.onaudioprocess = ev => {
      const d = ev.inputBuffer.getChannelData(0);
      loudCheck(d);
      try { voskRec.acceptWaveformFloat(new Float32Array(d), a.sampleRate); } catch (e) {}
    };
    srcNode.connect(micProc); micProc.connect(sink); sink.connect(a.destination);
    voskLoading = false; earState();
    return true;
  } catch (e) {
    console.warn('vosk failed', e); voskLoading = false; micOn = false; listenMode = ''; earState();
    return false;
  }
}
// While the hands are up, any short shout ("Peng!", "Bumm!", a clap) counts as a shot.
// The recognizer doesn't know "Peng" as a word, so this listens for a short burst of sound instead.
let noiseFloor = .01, segLoud = false, segStart = 0, segLast = 0;
function loudCheck(d) {
  let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
  const rms = Math.sqrt(s / d.length), t = now();
  const armed = hands.target > .5 && hands.t > .7 && !speaking && t - lastSaidEnd > 700 && !actionLock && t - lastLoud > 1500;
  if (rms > Math.max(.02, noiseFloor * 3.5)) {
    if (!segLoud) { segLoud = true; segStart = t; }
    segLast = t;
    if (armed && rms > .38 && rms > loudAvg * 7) { lastLoud = t; segLoud = false; bang(); }
  } else {
    noiseFloor = noiseFloor * .97 + rms * .03;
    if (segLoud && t - segLast > 250) {
      segLoud = false;
      const dur = segLast - segStart;
      // (short sounds alone no longer count as a shot: that fired by itself too often)
    }
  }
  loudAvg = loudAvg * .95 + rms * .05;
}

/* ================= Camera: finger-gun detection ================= */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let camOn = false, camStream = null, landmarker = null, lastDetect = 0, camGun = false, gunSince = 0, lastGunAt = 0, tipHist = [], lastRecoil = 0, camHandSeen = 0;
const video = $('#video');
async function startCam() {
  if (camOn || !navigator.mediaDevices) return;
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false }); }
  catch (e) { return; }
  video.srcObject = camStream; await video.play().catch(() => {});
  camOn = true;
  if (!landmarker) {
    try {
      const vision = await import(MP + '/vision_bundle.mjs');
      const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
      const opts = (delegate) => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate }, runningMode: 'VIDEO', numHands: 2 });
      try { landmarker = await vision.HandLandmarker.createFromOptions(files, opts('GPU')); }
      catch (e) { landmarker = await vision.HandLandmarker.createFromOptions(files, opts('CPU')); }
    } catch (e) { landmarker = null; }
  }
}
function stopCam() { camOn = false; if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; camGun = false; earState(); }
function isGun(lm) {
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const hs = d(0, 9) || .1;
  const curled = (tip, pip) => d(tip, 0) < d(pip, 0) * 1.1;
  const others = curled(12, 10) && curled(16, 14) && curled(20, 18);
  const idxOut = (d(8, 0) > d(6, 0) * 1.15 && d(8, 12) > hs * .55) || (lm[5].z - lm[8].z) > hs * .55;
  return others && idxOut;
}
function camStep(t) {
  if (!camOn || !landmarker || video.readyState < 2 || t - lastDetect < 50) return;
  lastDetect = t;
  let res; try { res = landmarker.detectForVideo(video, t); } catch (e) { return; }
  const all = res.landmarks || [];
  let gunNow = null;
  for (const lm of all) if (isGun(lm)) gunNow = lm;
  if (all.length) {
    camHandSeen = t;
    const target = gunNow || all[0];
    if (!actionLock && hands.target < .5) { gaze.tx = Math.max(-1, Math.min(1, (.5 - target[9].x) * 2.4)); gaze.ty = Math.max(-1, Math.min(1, (target[9].y - .5) * 2)); }
  }
  const was = camGun;
  if (gunNow) {
    if (!camGun) gunSince = t; camGun = true; lastGunAt = t;
    const hs = Math.hypot(gunNow[0].x - gunNow[9].x, gunNow[0].y - gunNow[9].y);
    tipHist.push({ t, y: gunNow[8].y, hs });
    if (t - gunSince > 400 && hands.target < .5 && !actionLock) raiseHands(true);
  } else if (t - lastGunAt > 350) camGun = false;
  tipHist = tipHist.filter(p => t - p.t < 260);
  if (tipHist.length > 2 && t - lastRecoil > 1500 && !actionLock) {
    const latest = tipHist[tipHist.length - 1], maxY = Math.max(...tipHist.map(p => p.y));
    if (maxY - latest.y > latest.hs * .7) { lastRecoil = t; tipHist = []; bang(); }
  }
  if (was !== camGun) earState();
}

/* ================= Boot: no buttons, no panels ================= */
// One-time brain setup without any screen: open the page once as  …/#key=sk-ant-…
(function readKeyFromLink() {
  const m = location.hash.match(/key=([^&]+)/);
  if (!m) return;
  settings.apiKey = decodeURIComponent(m[1]).trim(); saveSettings();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
})();
const pm = location.hash.match(/ort=([^&]+)/);
if (pm) { settings.place = decodeURIComponent(pm[1]); saveSettings(); }

let audioOk = false, greeted = false;
function audioReady() { return !!AC && AC.state === 'running'; }
// Safari lets a page play sound once it is using the microphone; other browsers wait for the first touch.
function tryAudio() {
  try { ac(); AC.resume().then(maybeGreet).catch(() => {}); } catch (e) {}
}
function maybeGreet() {
  if (greeted || !readyVoice || !readyEars) return;
  if (audioReady()) { audioOk = true; greet(); }
  else setSub('Tipp mich einmal an, dann kann ich sprechen!', true);
}
async function boot() {
  started = true; asleep = false; bootT = 0; activity();
  applyExpr('sleepy'); exprUntil = Infinity;
  try { ac(); } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
  showLoad();
  loadVoice();
  startListening();
  startMotion();
  if (settings.cam) startCam();
  await wait(1500);
  tryAudio();
}
function greet() {
  if (greeted) return; greeted = true;
  setSub(''); exprUntil = now();
  sfxPowerUp();
  say(pick(['Hallo! Ich bin Emo! Frag mich was!', 'Hi! Ich bin wach! Was machen wir?', 'Huhu! Da bist du ja!']), 'happy');
}
// Browsers only allow sound after the first touch. Any touch, click or key unlocks it once.
function unlock() {
  startMotion();
  try { ac(); } catch (e) {}
  if (!micOn) startListening();
  if (!audioOk) {
    audioOk = true;
    if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    try { AC.resume().then(maybeGreet, maybeGreet); } catch (e) { setTimeout(maybeGreet, 250); }
    return true;
  }
  return false;
}
addEventListener('keydown', unlock);
addEventListener('touchend', unlock, { passive: true });
addEventListener('click', unlock);

let taps = [];
cvs.addEventListener('pointerdown', async e => {
  if (!audioOk) return; // the first tap only wakes up sound and motion (handled on touchend/click)
  activity();
  if (await wake()) return;
  if (actionLock) return;
  taps = taps.filter(t => now() - t < 2000); taps.push(now());
  lookAt((e.clientX - W / 2) / (W / 2), (e.clientY - H / 2) / (H / 2), 1500);
  if (taps.length >= 5) { taps = []; say('Huiii! Mir ist ganz schwindelig!', 'dizzy', 3000); }
  else { sfxGiggle(); setExpr('laugh', 1200); }
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
boot();
